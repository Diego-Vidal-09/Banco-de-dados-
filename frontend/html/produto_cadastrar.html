<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/produto_cadastrar.js" defer></script>
    <title>Cadastrar Produto</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Produtos</span>&emsp;
            <a href="./produto_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./produto_listar.html">Listar</a>&emsp;
            <a href="./produto_consultar.html">Consultar</a>&emsp;
            <a href="./produto_atualizar.html">Atualizar</a>&emsp;
            <a href="./produto_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Novo Produto</h1>
        <br><br>
        <form>
            <label for="idUsuario">Usuário responsável</label><br>
            <select id="idUsuario" required>
                <option value="">Selecione um usuário</option>
            </select><br><br>
            <label for="nomeProduto">Nome do Produto</label><br>
            <input type="text" id="nomeProduto" required><br><br>

            <label for="categoria">Categoria</label><br>
            <input type="text" id="categoria" placeholder="Ex: CASUAL, SOCIAL" required><br><br>

            <label for="precoUnitario">Preço Unitário (R$)</label><br>
            <input type="number" step="0.01" id="precoUnitario" required><br><br>

            <label for="qtdeEstoque">Quantidade em Estoque</label><br>
            <input type="number" id="qtdeEstoque" required><br><br>

            <label for="data">Data de Cadastro</label><br>
            <input type="date" id="data" required><br><br>

            <button id="btn_cadastrar">Cadastrar Produto</button><br><br><br>
        </form>
        
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
