<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/usuario_consultar.js" defer></script>
    <title>Consultar Usuário</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Usuários</span>&emsp;
            <a href="./usuario_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./usuario_listar.html">Listar</a>&emsp;
            <a href="./usuario_consultar.html">Consultar</a>&emsp;
            <a href="./usuario_atualizar.html">Atualizar</a>&emsp;
            <a href="./usuario_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h2>Consultar Usuário por Código</h2>
        <br>
        <form>
            <label for="codUsuario">Código do Usuário (ID)</label><br>
            <input type="number" id="codUsuario" required><br><br>
            <button id="btn_consultar">Buscar por ID</button>
        </form>
        <br>
        <div id="resposta" class="resposta"></div>

        <br><br><hr><br>

        <h2>Consultar Usuário por Nome</h2>
        <br>
        <form>
            <label for="nome">Nome do Usuário</label><br>
            <input type="text" id="nome" required><br><br>
            <button id="btn_consultar_nome">Buscar por Nome</button>
        </form>
        <br>
        <div id="resposta_nome" class="resposta_nome"></div>
    </main>
</body>
</html>
